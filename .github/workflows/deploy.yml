name: Build, check, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # run it after a tool release, to pick up its firmware
  schedule:
    - cron: "17 4 * * *"    # daily safety net: dead video, renamed README heading, new release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}   # authenticated GitHub API calls (rate limit), read-only here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: python tools/check_site.py --online
      # While the repository is private the site is built and checked, never published.
      - name: Firmware and ESP Web Tools for the web flasher
        if: ${{ !github.event.repository.private }}
        run: |
          python tools/fetch_firmware.py
          python tools/fetch_vendor.py
          python tools/check_site.py --fetched
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: ${{ !github.event.repository.private }}
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
