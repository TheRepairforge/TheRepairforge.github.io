# Site-wide settings. Platform-specific content lives in platforms/<slug>.yml (D40).
base_url: https://therepairforge.github.io
name: The Repair Forge
# true: a "draft" strip on every page. Set to false on the day the site goes public.
draft: false
og_image: /assets/img/og-default.jpg
# Google Search Console, "HTML tag" method: the content= value only. Empty = no tag.
google_site_verification: "cc3548J30_mC8v2e1vCQTBbOQnJ44qR9p2cZE6huR_w"
youtube: https://www.youtube.com/@TheRepairForge
github_owner: TheRepairforge

# Main navigation, in order. "batteries" is filled by the generator: with one platform it links
# straight to that platform page, with two or more to /batteries/ (D40 point 7).
nav:
  - {key: diagnose, label: "Diagnose + Repair", href: /diagnose-repair/}
  - {key: batteries, label: Batteries}
  - {key: guides, label: Guides, href: /guides/}
  - {key: pocketobi, label: PocketOBI, href: /pocketobi/}
  - {key: packscope, label: PackScope, href: /packscope/}
  - {key: translate, label: Help translate, href: /translate/}
  - {key: about, label: About, href: /about/}

footer:
  generic: Brand names are used only to say which batteries these tools work with.
  disclaimer: Not affiliated with or endorsed by any tool maker.
  licences: "Firmware and PackScope: PolyForm Noncommercial 1.0.0. Hardware files and this site: CC BY-NC-SA 4.0."
  links:
    - {label: PocketOBI on GitHub, href: "https://github.com/TheRepairforge/PocketOBI"}
    - {label: PackScope on GitHub, href: "https://github.com/TheRepairforge/PackScope"}
    - {label: YouTube channel, href: "https://www.youtube.com/@TheRepairForge"}
    - {label: Support on Ko-fi, href: "https://ko-fi.com/therepairforge"}
    - {label: Help translate, href: /translate/}
    - {label: "About, credits, licences", href: /about/}

# Translation review (PLAN 2.8). Only PUBLISHED languages: a new one joins with the release that
# ships it. Strings are read from the public repos' default branch at build time.
translate:
  languages:
    de: {name: German, native: Deutsch}
    es: {name: Spanish, native: Español}
    # Japanese, Korean: device only (PackScope has no catalog for them). Separate tables
    # (strings_ja.h, strings_ko.h) drawn with the CJK font, so no ASCII rule. Asia build (PocketOBI 2.5).
    ja: {name: Japanese, native: 日本語, firmware: strings_ja.h, packscope: false}
    ko: {name: Korean, native: 한국어, firmware: strings_ko.h, packscope: false}
    # Vietnamese: device only, a separate table drawn like DE/ES by the narrow Latin path (latin: true: width
    # rule, accents allowed, PocketOBI 2.8), written by a Vietnamese user (by_native: true), so not called a
    # first draft. Asia build (PocketOBI 2.5).
    vi: {name: Vietnamese, native: Tiếng Việt, firmware: strings_vi.h, packscope: false, latin: true, by_native: true}
    # Polish: device only (PackScope has no catalog), own table, narrow Latin path. Standard build (PocketOBI 2.8), #39.
    pl: {name: Polish, native: Polski, firmware: strings_pl.h, packscope: false, latin: true}
  # /translate/new/ ("add your language"): every language the published tools already speak (the review
  # list above is a subset), and requests already under way, so nobody starts one twice.
  shipped: [English, French, German, Spanish, Polish, Japanese, Korean, Vietnamese, Simplified Chinese, Traditional Chinese]
  in_progress:
    - {name: Russian, href: "https://github.com/TheRepairforge/PocketOBI/issues/37"}
  sources:
    PocketOBI: {file: strings_i18n.h, kind: strtab}
    PackScope: {dir: packscope/locales, kind: json}
